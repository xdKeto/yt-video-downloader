[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-downloader"
version = "0.1.0"
description = "A Windows-friendly YouTube video and archive downloader"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["yt-dlp[default]>=2025.1.0"]

[project.scripts]
stream-downloader = "stream_downloader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

